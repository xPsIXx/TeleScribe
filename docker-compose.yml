services:
  telescribe:
    build: .
    container_name: telescribe
    restart: unless-stopped
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - ASR_ENGINE=${ASR_ENGINE:-local}
      - ASR_MODEL=${ASR_MODEL:-distil-medium.en}
      - ASR_DEVICE=${ASR_DEVICE:-cpu}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://localhost:8088/v1}
      - LLM_MODEL=${LLM_MODEL:-qwen3.5-9b}
    volumes:
      - telescribe_data:/data
      - telescribe_cache:/root/.cache  # whisper model cache
    ports:
      - "127.0.0.1:8180:8180"

volumes:
  telescribe_data:
  telescribe_cache:
