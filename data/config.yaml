# TeleScribe configuration — edited by the web dashboard (Save & Reload).
# TELEGRAM_BOT_TOKEN and LLM_API_KEY always come from the environment.

bot:
  privacy_mode: true
  admin_user_ids: []
  authorized_users: []
  show_transcribing_feedback: true
  show_transcription_header: true
  auth_required_summarize: true
  auth_required_reply: true
  auth_required_transcribe: true

  prompts:
    summary: |
      Summarize the following group chat messages concisely.
      Focus on key decisions, action items, and important information.
      Format as bullet points.

    reply: |
      You are a helpful assistant in a Telegram group chat.
      Reply naturally and conversationally.

    transcription_context: |
      The following text was transcribed from a voice message.
      Please process it as if the user typed it directly.

transcription:
  engine: local  # local, moonshine, parakeet
  model: distil-large-v3
  device: cpu    # cpu, cuda
  compute_type: int8
  beam_size: 5
  condition_on_previous_text: false
  vad_filter: false
  vad_min_silence_ms: 700
  vad_speech_pad_ms: 400
  vad_threshold: 0.45
  hallucination_silence_threshold: 2.0
  language: null  # null = auto-detect
  asr_defaults_version: 2

llm:
  base_url: http://localhost:8088/v1
  api_key: ""
  model: qwen3.5-9b
  temperature: 0.7
  max_tokens: 4096
  stream: true

web:
  host: 0.0.0.0
  port: 8180

history:
  retention_days: 90
  reply_retention_days: 30
  summarize_retention_days: 30
  max_chats: 100
